name: Cache wallpaper in repository

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-wallpaper.yml'

permissions:
  contents: write

jobs:
  cache-wallpaper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wallpaper
        run: |
          mkdir -p assets
          curl -fL --retry 3 --retry-delay 2 \
            'https://d.uguu.se/qFvfruyh.jpg' \
            -o assets/wallpaper.jpg
          test -s assets/wallpaper.jpg

      - name: Point config to permanent GitHub raw URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config.ini')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace(
              'WallpaperURL=https://d.uguu.se/qFvfruyh.jpg',
              'WallpaperURL=https://raw.githubusercontent.com/erereck/novaordemmundial/main/assets/wallpaper.jpg'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit wallpaper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/wallpaper.jpg config.ini
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Cache wallpaper in repository'
          git push
